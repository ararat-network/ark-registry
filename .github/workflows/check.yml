name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated:
    name: Generated files match ark at ARK_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "ref=$(cat ARK_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ararat-network/ark
          ref: ${{ steps.version.outputs.ref }}
          # Not "ark": that is the mainnet entry's directory.
          path: chain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: chain/go.mod
          cache-dependency-path: chain/go.sum
      - name: Regenerate
        working-directory: chain
        run: go run ./contrib/registry --out "$GITHUB_WORKSPACE/out" --endpoints "$GITHUB_WORKSPACE/endpoints.json" --version "${{ steps.version.outputs.ref }}"
      - name: Compare
        run: |
          for d in ark arktestnet arklocal images; do
            diff -r "out/$d" "$d"
          done
  schema:
    name: Standard files validate against the community schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund ajv@8 ajv-formats@3
      - run: node validate.cjs .
